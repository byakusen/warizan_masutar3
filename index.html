<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>わり算マスター</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- 紙吹雪用ライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        /* ベース設定：シアン・ブルー系の爽やかなデザイン */
        body { 
            font-family: 'M PLUS Rounded 1c', sans-serif; 
            margin: 0; padding: 0; 
            background: linear-gradient(135deg, #cffafe 0%, #e0f2fe 100%); /* cyan-100 to sky-100 */
            min-height: 100vh; overflow: hidden;
            user-select: none; -webkit-tap-highlight-color: transparent;
            display: flex; flex-direction: column;
            color: #0e7490; /* cyan-700 */
        }
        /* グラスモーフィズム効果 */
        .glass { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(12px); border: 2px solid rgba(255, 255, 255, 0.9); box-shadow: 0 8px 32px rgba(8, 145, 178, 0.15); }
        .hidden { display: none !important; }
        .btn-active:active { transform: scale(0.96); filter: brightness(1.1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* アニメーション */
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .fade-in { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes rockShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-3px) rotate(-3deg); } 75% { transform: translateX(3px) rotate(3deg); } }
        .animate-shake { animation: rockShake 0.1s linear infinite; }
        
        .firework-particle { position: absolute; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; z-index: 100; box-shadow: 0 0 6px currentColor; }
        @keyframes explode { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
        
        .path-hanamaru { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: drawHanamaru 2s ease-out forwards; }
        @keyframes drawHanamaru { to { stroke-dashoffset: 0; } }

        /* キャラクターアニメーション */
        @keyframes char-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes char-spin { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(10deg) scale(1.2); } 100% { transform: rotate(0deg) scale(1); } }
        @keyframes char-sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
        
        .anim-bounce { animation: char-bounce 0.4s ease-out 2; }
        .anim-spin { animation: char-spin 0.6s ease-in-out; }
        .anim-sway { animation: char-sway 1s ease-in-out infinite; }

        /* テンキー配置 */
        .numpad-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding-bottom: 4px; max-width: 400px; margin: 0 auto; width: 100%; }
        /* OKボタン */
        .ok-btn-cell { background: linear-gradient(135deg, #06b6d4, #0891b2); color: white; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.5rem; border-radius: 16px; box-shadow: 0 4px 0 #155e75; border: none; }
        .ok-btn-cell:active { box-shadow: 0 0 0 #155e75; transform: translateY(4px); }

        .num-btn { background: rgba(255,255,255,0.95); color: #0e7490; border-radius: 16px; font-weight: 800; font-size: 1.5rem; box-shadow: 0 4px 0 rgba(8, 145, 178, 0.15); border: 1px solid rgba(255,255,255,0.8); }
        .num-btn:active { box-shadow: none; transform: translateY(4px); }

        /* 認定証スタイル */
        .cert-container { 
            position: relative; 
            width: 100%; 
            max-width: 600px; 
            margin: 0 auto; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            border-radius: 8px; 
            overflow: hidden; 
            user-select: auto; 
        }
        .cert-bg { width: 100%; height: auto; display: block; }
        
        .cert-input {
            position: absolute;
            background: transparent;
            border: 1px dashed rgba(0,0,0,0.0);
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-weight: bold;
            color: #164e63; /* cyan-900 */
            padding: 0 2px;
            line-height: 1.1;
            z-index: 10;
        }
        .cert-input:focus { 
            background: rgba(255, 255, 255, 0.15); 
            border: 2px solid rgba(6, 182, 212, 0.15); 
            outline: none; 
            border-radius: 4px;
        }

        /* 写真エリア */
        .cert-photo-area {
            position: absolute;
            background: #f3f4f6;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            border-radius: 4px;
            border: 2px dashed #22d3ee;
            z-index: 5;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cert-photo-area:hover { border-color: #0891b2; background: #ecfeff; }
        .cert-photo-img { width: 100%; height: 100%; object-fit: cover; }
        
        /* ボタン無効状態 */
        .btn-disabled { opacity: 0.5; pointer-events: none; background: #eee !important; color: #aaa !important; border-color: #ddd !important; box-shadow: none !important; }
        
        /* モードボタンアクティブ/非アクティブ */
        .mode-btn-active { background: #06b6d4 !important; color: white !important; border-bottom: 3px solid #0e7490 !important; box-shadow: 0 4px 6px -1px rgba(6, 182, 212, 0.4); }
        .mode-btn-inactive { color: #0e7490 !important; background: rgba(255,255,255,0.6); border-bottom: 3px solid transparent !important; }
        .mode-btn-inactive:hover { background: rgba(255,255,255,0.9); }
        .mode-btn-disabled { color: #9ca3af !important; background: #e5e7eb !important; border-bottom: 3px solid transparent !important; cursor: not-allowed; opacity: 0.6; }

        /* 段ボタン */
        .dan-btn-active { background: #0ea5e9; color: white; border: 2px solid #0284c7; transform: scale(1.02); box-shadow: 0 4px 10px rgba(14, 165, 233, 0.4); }
        .dan-btn-inactive { background: #ffffff; color: #0369a1; border: 1px solid #e0f2fe; }

        /* 式のグリッドレイアウト：9列構成で縦を完璧に揃える */
        .formula-container { 
            display: grid; 
            grid-template-columns: repeat(9, auto); 
            align-items: center; 
            column-gap: 0.2rem; 
            white-space: nowrap;
        }
        /* 列の幅をある程度固定して揃えやすくする */
        .col-dividend { min-width: 3rem; text-align: right; }
        .col-op-div { width: 1.5rem; text-align: center; }
        .col-divisor { min-width: 2.2rem; text-align: center; }
        .col-eq-x { width: 1.5rem; text-align: center; }
        .col-ans-q { min-width: 3.5rem; text-align: center; }
        .col-rem-op-plus { width: 1.5rem; text-align: center; }
        .col-rem-val-circ { min-width: 3.5rem; text-align: center; }
        .col-hint-eq { width: 1.5rem; text-align: center; }
        .col-hint-res { min-width: 3.5rem; text-align: left; }
        
    </style>
</head>
<body class="p-2 flex justify-center items-center">

    <div id="app-root" class="max-w-md mx-auto w-full h-[100dvh] flex flex-col relative transition-transform pb-2">
        
        <!-- タブ -->
        <div class="flex bg-white/50 backdrop-blur-md rounded-full p-1 mb-2 shadow-sm flex-none h-12 items-center border border-white/60">
            <button id="nav-challenge" onclick="switchTab('challenge')" class="flex-1 h-full rounded-full text-sm font-bold transition-all bg-cyan-500 text-white shadow-md flex items-center justify-center gap-1">
                <i data-lucide="zap" class="w-4 h-4"></i> チャレンジ
            </button>
            <button id="nav-record" onclick="switchTab('record')" class="flex-1 h-full rounded-full text-sm font-bold transition-all text-cyan-600 flex items-center justify-center gap-1 hover:bg-white/40">
                <i data-lucide="book-open" class="w-4 h-4"></i> きろく
            </button>
        </div>

        <!-- 画面1：メニュー -->
        <div id="scr-menu" class="screen glass rounded-3xl p-3 text-center flex-1 flex flex-col justify-start overflow-y-auto no-scrollbar relative fade-in">
            
            <div class="space-y-2 relative flex flex-col h-full min-h-[500px]">
                <h1 class="text-lg font-black text-cyan-700 flex justify-center items-center gap-2 mt-1 drop-shadow-sm flex-none tracking-tight">
                    <i data-lucide="calculator" class="w-5 h-5 fill-cyan-100"></i> わり算マスター
                </h1>

                <!-- 名前入力 -->
                <div class="bg-cyan-50/80 p-1.5 rounded-xl border border-cyan-100 shadow-inner flex-none">
                    <input type="text" id="user-name-input" placeholder="おなまえ (例: 3-1 たろう)" 
                           class="w-full bg-transparent text-center font-bold text-cyan-900 placeholder-cyan-300 outline-none text-base"
                           oninput="saveName()">
                </div>
                
                <div class="text-left text-xs font-bold text-cyan-500 pl-1 flex-none mt-1">▼ わり算の段をえらんでね</div>
                
                <!-- 段ボタンエリア (3列) -->
                <div id="dan-buttons-area" class="grid grid-cols-3 gap-2 flex-1 content-start w-full max-w-[360px] mx-auto"></div>
                
                <!-- モード切替（3択：あまりなし/あまりあり/ランダム） -->
                <div class="bg-cyan-50/50 p-1 rounded-xl border border-white flex-none mt-1">
                    <div class="flex gap-1 items-stretch">
                        <button id="mode-no-rem" class="flex-[1] py-2.5 rounded-lg font-bold text-[12px] tracking-tighter leading-none transition-all mode-btn-active whitespace-nowrap overflow-hidden" onclick="setMode('NO_REM')">
                            あまりなし
                        </button>
                        <button id="mode-has-rem" class="flex-[1] py-2.5 rounded-lg font-bold text-[12px] tracking-tighter leading-none transition-all mode-btn-inactive whitespace-nowrap overflow-hidden" onclick="setMode('HAS_REM')">
                            あまりあり
                        </button>
                        <button id="mode-random" class="flex-[1] py-2.5 rounded-lg font-bold text-[13px] transition-all mode-btn-inactive flex items-center justify-center whitespace-nowrap overflow-hidden" onclick="setMode('RANDOM')">
                            ランダム
                        </button>
                    </div>
                </div>
                
                <!-- スタートボタン -->
                <button onclick="startGame('stage')" class="flex-none w-full py-3 bg-gradient-to-r from-cyan-400 to-sky-400 text-white rounded-xl font-black text-xl shadow-lg btn-active flex items-center justify-center gap-2 border-b-4 border-sky-500 relative top-0 active:top-[4px] active:border-b-0 transition-all mt-1">
                    <i data-lucide="play" class="w-6 h-6 fill-current"></i> スタート！
                </button>

                <!-- ニガテボタン（条件付き表示） -->
                <div id="nigate-area" class="hidden flex-none w-full animate-pulse mt-1">
                     <button onclick="startGame('nigate')" class="w-full py-2 bg-gradient-to-r from-orange-400 to-red-400 text-white rounded-xl font-black text-base shadow-md btn-active border-b-2 border-red-600 flex items-center justify-center gap-2">
                        <span class="text-xl">🔥</span> ニガテをこくふく！ <span id="nigate-count" class="text-sm bg-white/20 px-2 rounded-full"></span>
                    </button>
                </div>

                <!-- スペシャルボタンエリア -->
                <div class="space-y-1 pt-1 flex-none pb-4">
                    <div class="grid grid-cols-2 gap-2">
                        <button id="btn-sp-15" onclick="startGame('range', '15')" class="py-2 rounded-xl font-bold text-sm shadow-sm border border-gray-200 bg-white text-gray-400 cursor-not-allowed relative h-10 flex items-center justify-center" disabled>
                            <span class="flex items-center gap-1"><i data-lucide="lock" class="w-4 h-4"></i> ÷1〜÷5</span>
                        </button>
                        <button id="btn-sp-69" onclick="startGame('range', '69')" class="py-2 rounded-xl font-bold text-sm shadow-sm border border-gray-200 bg-white text-gray-400 cursor-not-allowed relative h-10 flex items-center justify-center" disabled>
                            <span class="flex items-center gap-1"><i data-lucide="lock" class="w-4 h-4"></i> ÷6〜÷9</span>
                        </button>
                    </div>
                    <div class="relative h-12" id="last-challenge-box">
                        <!-- ロックレイヤー -->
                        <div id="rock-layer" class="absolute inset-0 z-20 flex items-center justify-center bg-gradient-to-br from-slate-400 to-slate-500 border-b-4 border-slate-600 rounded-xl shadow-lg cursor-pointer transition-transform" onclick="tryCrumble()">
                            <div class="text-slate-100 font-black text-[10px] tracking-widest flex flex-col items-center">
                                <span class="flex items-center gap-1"><i data-lucide="lock" class="w-3 h-3"></i> MASTER SEAL</span>
                            </div>
                        </div>
                        <button id="btn-sp-last" onclick="startGame('last')" class="w-full h-full rounded-xl font-black text-base shadow-md border-2 border-gray-200 bg-white text-gray-400 cursor-not-allowed relative flex items-center justify-center" disabled>
                            <span class="flex items-center gap-1"><i data-lucide="lock" class="w-4 h-4"></i> ラストチャレンジ</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 画面2：ゲームプレイ -->
        <div id="screen-game" class="screen hidden flex-1 flex flex-col min-h-0 space-y-3 fade-in">
            <!-- タイムバー -->
            <div class="w-full bg-white/50 rounded-full h-3 overflow-hidden shadow-inner p-0.5">
                <div id="time-bar" class="bg-gradient-to-r from-cyan-400 to-blue-500 h-full rounded-full transition-all duration-1000 ease-linear" style="width: 100%"></div>
            </div>
            
            <div class="glass rounded-2xl px-4 py-2 flex justify-between items-center flex-none text-cyan-700 shadow-sm h-14">
                <div class="flex items-center gap-2">
                    <div class="bg-cyan-100 p-1.5 rounded-full"><i data-lucide="timer" class="w-5 h-5"></i></div>
                    <span id="display-timer" class="text-3xl font-mono font-black tracking-tighter">30</span>
                </div>
                <div id="display-count" class="px-3 py-1 bg-white text-cyan-600 rounded-full text-xs font-bold border border-cyan-100 shadow-sm">あと 9 問</div>
            </div>
            
            <!-- 問題表示エリア -->
            <div class="glass rounded-3xl flex-1 flex flex-col justify-center items-start text-left shadow-lg relative min-h-0 px-6 py-4 mb-2 overflow-hidden">
                <div class="absolute top-3 left-0 w-full text-center">
                    <span class="bg-cyan-50/80 px-4 py-1 rounded-full text-[10px] text-cyan-500 font-bold uppercase tracking-widest border border-cyan-100">Question</span>
                </div>

                <!-- 応援キャラクター -->
                <div id="char-container" class="absolute -top-6 left-2 z-20 flex flex-col items-center">
                    <div id="char-bubble" class="hidden mb-1 px-2 py-1 bg-white text-cyan-600 text-xs font-bold rounded-lg shadow-sm border border-cyan-100 whitespace-nowrap fade-in">がんばれ！</div>
                    <div id="char-body" class="text-4xl filter drop-shadow-md transition-transform cursor-pointer inline-block" onclick="pokeCharacter()">🐶</div>
                </div>

                <!-- ヒントボタン -->
                <button onclick="toggleHint()" class="absolute top-2 right-2 p-2 bg-amber-50 text-amber-500 rounded-full border border-amber-200 shadow-sm hover:bg-amber-100 active:scale-95 transition-all">
                    <i data-lucide="lightbulb" class="w-5 h-5"></i>
                </button>
                
                <!-- 式のコンテナ：9列のグリッドで縦を完璧に揃える -->
                <div class="w-full mt-4 flex flex-col items-start gap-2">
                    
                    <!-- わり算の行 -->
                    <div class="formula-container text-4xl sm:text-5xl font-black text-slate-700">
                        <span id="q-dividend" class="col-dividend">24</span>
                        <span class="col-op-div text-cyan-300 text-3xl">÷</span>
                        <span id="q-divisor" class="col-divisor">3</span>
                        <span class="col-eq-x text-cyan-300 text-3xl">＝</span>
                        <div id="a-field" class="col-ans-q h-16 sm:h-20 border-b-4 border-cyan-300 text-cyan-700 flex items-center justify-center bg-white/60 rounded-xl shadow-inner transition-all">?</div>
                        <span id="rem-op" class="col-rem-op-plus text-cyan-300 text-2xl hidden">…</span>
                        <div id="rem-field" class="col-rem-val-circ h-16 sm:h-20 border-b-4 border-cyan-200 text-cyan-700 flex items-center justify-center bg-white/40 rounded-xl shadow-inner transition-all hidden"></div>
                        <!-- 空白列 -->
                        <div class="col-hint-eq w-8"></div>
                        <div class="col-hint-res w-16"></div>
                    </div>
                    
                    <!-- 逆算ヒントの行 -->
                    <div id="hint-row" class="formula-container text-3xl sm:text-4xl font-bold text-amber-500 hidden">
                        <div class="col-dividend opacity-0">00</div> <!-- 配当の真下は空白 -->
                        <div class="col-op-div opacity-0">÷</div> <!-- 演算子の真下も空白 -->
                        <span id="h-divisor" class="col-divisor">3</span> <!-- 割る数の真下 -->
                        <span class="col-eq-x text-amber-300 text-2xl">✕</span> <!-- ＝の真下 -->
                        <div id="h-quot-box" class="col-ans-q h-12 sm:h-16 border-2 border-dashed border-amber-200 text-amber-400 flex items-center justify-center bg-white/40 rounded-xl">▢</div> <!-- 商の真下 -->
                        <span id="h-plus" class="col-rem-op-plus text-amber-300 text-xl hidden">＋</span> <!-- あまり記号の真下 -->
                        <div id="h-rem-circ" class="col-rem-val-circ text-amber-400 text-2xl hidden">◯</div> <!-- あまりの値の真下 -->
                        <span class="col-hint-eq text-amber-300 text-2xl">＝</span>
                        <span id="h-dividend" class="col-hint-res">24</span> <!-- 最後に配当 -->
                    </div>

                </div>
            </div>

            <!-- テンキー (電話配列) -->
            <div class="numpad-container flex-none">
                <button class="num-btn h-14" onclick="inputNum(1)">1</button>
                <button class="num-btn h-14" onclick="inputNum(2)">2</button>
                <button class="num-btn h-14" onclick="inputNum(3)">3</button>
                
                <button class="num-btn h-14" onclick="inputNum(4)">4</button>
                <button class="num-btn h-14" onclick="inputNum(5)">5</button>
                <button class="num-btn h-14" onclick="inputNum(6)">6</button>
                
                <button class="num-btn h-14" onclick="inputNum(7)">7</button>
                <button class="num-btn h-14" onclick="inputNum(8)">8</button>
                <button class="num-btn h-14" onclick="inputNum(9)">9</button>
                
                <button class="glass h-14 rounded-2xl flex items-center justify-center bg-rose-50 text-rose-400 active:bg-rose-100 active:scale-95 transition-transform" onclick="deleteNum()">
                    <i data-lucide="delete" class="w-6 h-6"></i>
                </button>
                <button class="num-btn h-14" onclick="inputNum(0)">0</button>
                <button class="ok-btn-cell h-14" onclick="submitAnswer()">OK</button>
            </div>
        </div>

        <!-- 画面3：結果 -->
        <div id="screen-result" class="screen hidden glass rounded-3xl p-6 text-center flex-1 flex flex-col justify-center items-center relative overflow-hidden fade-in">
            <div id="fireworks-container" class="absolute inset-0 pointer-events-none z-0"></div>
            <div id="hanamaru-area" class="flex justify-center items-center w-full h-48 mb-4 z-10 relative drop-shadow-xl"></div>
            <div class="z-10 relative w-full bg-white/60 p-6 rounded-3xl backdrop-blur-sm border border-white shadow-xl">
                <h2 id="result-msg" class="text-4xl font-black text-cyan-600 mb-2 tracking-wider"></h2>
                <p id="result-sub" class="text-sm font-bold text-gray-500 mb-6"></p>
                <div class="w-full">
                    <button onclick="backToTitle()" class="w-full py-3 rounded-xl font-black text-xl shadow-lg bg-gradient-to-r from-cyan-500 to-blue-500 text-white btn-active flex items-center justify-center gap-2 border-b-4 border-cyan-700 active:border-b-0 active:translate-y-1">
                        <i data-lucide="home" class="w-6 h-6"></i> タイトルへもどる
                    </button>
                </div>
            </div>
        </div>

        <!-- 画面4：記録 -->
        <div id="screen-record" class="screen hidden flex-1 flex flex-col min-h-0 space-y-2 fade-in overflow-hidden">
            <div id="master-badge" class="hidden flex-none text-center py-4 bg-gradient-to-br from-yellow-50 to-white rounded-2xl border-2 border-yellow-200 shadow-sm relative overflow-hidden shrink-0">
                <div class="absolute top-0 left-0 w-full h-2 bg-yellow-300"></div>
                <div id="master-svg" class="flex justify-center mb-1 scale-90 h-20 items-center drop-shadow-md"></div>
                <p class="text-yellow-600 font-black text-xl relative z-10 mt-1">🏆 わり算マスター免許</p>
                <button onclick="startCertFlow()" class="absolute bottom-3 right-3 bg-yellow-400 text-white text-xs font-bold px-4 py-2 rounded-full shadow-lg hover:bg-yellow-500 z-20 cursor-pointer flex items-center gap-1">
                    <i data-lucide="award" class="w-3 h-3"></i> つくる
                </button>
            </div>
            
            <div class="glass p-3 rounded-2xl shadow-sm flex-none">
                <h3 class="text-xs font-black text-cyan-700 mb-2 flex items-center gap-2 border-b border-cyan-100 pb-1">
                    <i data-lucide="star" class="w-4 h-4 text-amber-400 fill-current"></i> スペシャルチャレンジ
                </h3>
                <div class="grid grid-cols-3 gap-2" id="special-badges-grid"></div>
            </div>
            
            <div class="bg-white/60 rounded-2xl p-3 shadow-md border border-white/50 flex-1 min-h-0 flex flex-col">
                <div class="overflow-y-auto flex-1 no-scrollbar">
                    <table class="w-full text-xs text-center border-collapse">
                        <thead class="sticky top-0 bg-white/95 backdrop-blur-sm z-10 shadow-sm">
                            <tr class="text-cyan-400 border-b border-cyan-100">
                                <th class="pb-2 font-bold text-left pl-4 py-2">だん</th>
                                <th class="pb-2 font-bold text-[10px] py-2">あまり無</th>
                                <th class="pb-2 font-bold text-[10px] py-2">あまり有</th>
                                <th class="pb-2 font-bold text-[10px] py-2">ランダム</th>
                            </tr>
                        </thead>
                        <tbody id="record-tbody" class="text-gray-600"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 画面5：認定証作成 -->
        <div id="screen-cert-maker" class="screen hidden glass rounded-xl p-2 text-center flex-1 flex flex-col justify-start overflow-y-auto no-scrollbar relative">
            <h2 class="text-lg font-black text-cyan-700 mb-2 flex items-center justify-center gap-2">
                <i data-lucide="award" class="w-5 h-5 text-amber-500"></i> めんきょしょう
            </h2>
            <p class="text-[10px] text-gray-500 mb-2">文字や写真はタップしてかえられます。<br>完成したらスクリーンショットをとってね！</p>

            <!-- 認定証本体 -->
            <div id="cert-node" class="cert-container relative w-full bg-white rounded shadow-xl overflow-hidden">
                <img src="https://raw.githubusercontent.com/byakusen/warizan_menkyo/refs/heads/main/warizan_menkyo.png" class="cert-bg" alt="認定証背景">
                
                <!-- 1. 氏名 -->
                <input type="text" id="in-name" value="" placeholder="おなまえ" class="cert-input text-center" 
                       style="top: 27.15%; left: 23.4%; width: 45%;">

                <!-- 2. 写真エリア -->
                <div id="cert-photo" class="cert-photo-area" onclick="document.getElementById('file-input').click()" 
                     style="top: 27.8%; left: 12.0%; width: 17.3%; height: 39%; border-radius: 4px;">
                    <img id="cert-photo-img" class="w-full h-full object-cover hidden">
                    <div id="cert-photo-placeholder" class="text-center text-cyan-400">
                        <i data-lucide="camera" class="w-4 h-4 mx-auto mb-1"></i>
                        <span class="text-[6px] block leading-tight font-bold">しゃしん</span>
                    </div>
                </div>

                <!-- 3. 生年月日 -->
                <input type="text" id="in-birth-y" placeholder="2017" class="cert-input text-right" style="top: 27.3%; left: 51.0%; width: 21.25%;">
                <input type="text" id="in-birth-m" placeholder="4" class="cert-input text-center" style="top: 27.5%; left: 73.7%; width: 6%;">
                <input type="text" id="in-birth-d" placeholder="1" class="cert-input text-center" style="top: 27.5%; left: 80.8%; width: 6%;">
                
                <!-- 4. 住所 -->
                <input type="text" id="in-address" placeholder="わり算市 あまり1丁目" class="cert-input text-left" 
                       style="top: 33.8%; left: 40.0%; width: 60%;">
                       
                <!-- 5. 学校 -->
                <input type="text" id="in-school" placeholder="九九小学校" class="cert-input text-center" 
                       style="top: 40.6%; left: 29.2%; width: 35%;">

                <!-- 6. 学年 -->
                <input type="text" id="in-grade" value="3" class="cert-input text-center" 
                       style="top: 40.2%; left: 78.9%; width: 10%;">

            </div>

            <input type="file" id="file-input" accept="image/*" class="hidden" onchange="loadPhoto(event)">

            <button onclick="switchTab('record')" class="mt-4 py-2 px-6 rounded-full bg-gray-400 text-white font-bold text-xs shadow-md btn-active mx-auto block">
                もどる
            </button>
        </div>

    </div>

    <!-- 音源 -->
    <audio id="se-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
    <audio id="se-wrong" src="https://assets.mixkit.co/active_storage/sfx/255/255-preview.mp3"></audio>
    <audio id="se-fanfare" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>
    <audio id="se-crumble" src="https://assets.mixkit.co/active_storage/sfx/2658/2658-preview.mp3"></audio>

    <script>
        // ÷1〜÷9
        const STAGES = [1, 2, 3, 4, 5, 6, 7, 8, 9];
        
        let state = {
            dan: 2, 
            mode: 'NO_REM', 
            gameType: 'stage',
            problems: [], 
            index: 0, 
            inputAns: "", 
            inputRem: "", 
            timer: 30, 
            maxTime: 30,
            intervalId: null, 
            currentKey: "", 
            waitingForCrumble: false,
            isNoRemMode: true,
            showHint: false,
            combo: 0
        };
        
        const STORAGE_KEY_RECORDS = 'warizan_app_v3_records';
        const STORAGE_KEY_NAME = 'warizan_app_v3_username';
        const STORAGE_KEY_VIEW = 'warizan_app_v3_view';
        const STORAGE_KEY_CERT = 'warizan_app_v3_cert';
        const STORAGE_KEY_NIGATE = 'warizan_app_v3_nigate'; 

        let savedRecords = JSON.parse(localStorage.getItem(STORAGE_KEY_RECORDS)) || {};
        let savedName = localStorage.getItem(STORAGE_KEY_NAME) || "";
        let savedNigate = JSON.parse(localStorage.getItem(STORAGE_KEY_NIGATE)) || []; 

        window.onload = () => {
            lucide.createIcons();
            document.getElementById('user-name-input').value = savedName;
            
            loadCertInfo();
            renderMenu();
            renderRecords();

            const lastView = localStorage.getItem(STORAGE_KEY_VIEW);
            if (lastView === 'cert-maker') {
                switchTab('record', false);
                startCertFlow();
            } else if (lastView === 'record') {
                switchTab('record');
            } else {
                switchTab('challenge');
            }

            ['in-name', 'in-school', 'in-grade', 'in-address', 'in-birth-y', 'in-birth-m', 'in-birth-d'].forEach(id => {
                document.getElementById(id).addEventListener('input', saveCertInfo);
            });
            window.addEventListener('resize', adjustCertFonts);
            adjustCertFonts();
        };

        function saveName() {
            const val = document.getElementById('user-name-input').value;
            localStorage.setItem(STORAGE_KEY_NAME, val);
        }

        function saveViewState(view) {
            localStorage.setItem(STORAGE_KEY_VIEW, view);
        }

        function saveCertInfo() {
            const info = {
                name: document.getElementById('in-name').value,
                school: document.getElementById('in-school').value,
                grade: document.getElementById('in-grade').value,
                address: document.getElementById('in-address').value,
                birthY: document.getElementById('in-birth-y').value,
                birthM: document.getElementById('in-birth-m').value,
                birthD: document.getElementById('in-birth-d').value,
            };
            localStorage.setItem(STORAGE_KEY_CERT, JSON.stringify(info));
        }

        function loadCertInfo() {
            const infoStr = localStorage.getItem(STORAGE_KEY_CERT);
            const menuName = localStorage.getItem(STORAGE_KEY_NAME) || ""; 
            
            if (infoStr) {
                const info = JSON.parse(infoStr);
                document.getElementById('in-name').value = info.name || menuName;
                document.getElementById('in-school').value = info.school || "";
                document.getElementById('in-grade').value = info.grade || "3";
                document.getElementById('in-address').value = info.address || "";
                document.getElementById('in-birth-y').value = info.birthY || "";
                document.getElementById('in-birth-m').value = info.birthM || "";
                document.getElementById('in-birth-d').value = info.birthD || "";
            } else {
                document.getElementById('in-name').value = menuName;
            }
        }

        function adjustCertFonts() {
            const container = document.getElementById('cert-node');
            if (!container) return;
            const w = container.offsetWidth;
            
            // 指示に基づくフォントサイズ計算
            document.getElementById('in-name').style.fontSize = (w * 0.0253) + 'px'; 
            document.getElementById('in-school').style.fontSize = (w * 0.02394) + 'px'; // 9/10縮小
            document.getElementById('in-address').style.fontSize = (w * 0.025) + 'px';
            document.getElementById('in-birth-y').style.fontSize = (w * 0.024) + 'px'; 
            document.getElementById('in-birth-m').style.fontSize = (w * 0.024) + 'px'; 
            document.getElementById('in-birth-d').style.fontSize = (w * 0.024) + 'px'; 
            document.getElementById('in-grade').style.fontSize = (w * 0.0288) + 'px'; 
        }

        function startCertFlow() {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('screen-cert-maker').classList.remove('hidden');
            saveViewState('cert-maker');
            adjustCertFonts();
            
            const menuName = document.getElementById('user-name-input').value;
            if (menuName) {
                const current = document.getElementById('in-name').value;
                if(!current) {
                     document.getElementById('in-name').value = menuName;
                     saveCertInfo();
                }
            }
            lucide.createIcons();
        }

        function loadPhoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('cert-photo-img');
                    img.src = e.target.result;
                    img.classList.remove('hidden');
                    document.getElementById('cert-photo-placeholder').classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function switchTab(tabName, shouldSave = true) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            const btnGame = document.getElementById('nav-challenge');
            const btnRec = document.getElementById('nav-record');
            
            const inactiveClass = "flex-1 h-full rounded-full text-sm font-bold transition-all text-cyan-600 flex items-center justify-center gap-1 hover:bg-white/30";
            const activeClass = "flex-1 h-full rounded-full text-sm font-bold transition-all bg-cyan-500 text-white shadow-md flex items-center justify-center gap-1";

            btnGame.className = inactiveClass;
            btnRec.className = inactiveClass;

            if (tabName === 'challenge') {
                document.getElementById('scr-menu').classList.remove('hidden');
                btnGame.className = activeClass;
                if (state.waitingForCrumble) {
                    state.waitingForCrumble = false;
                    checkUnlockAndCrumble();
                } else { renderMenu(); }
            } else {
                document.getElementById('screen-record').classList.remove('hidden');
                renderRecords();
                btnRec.className = activeClass;
            }
            if(shouldSave) saveViewState(tabName);
        }

        function backToTitle() {
            document.querySelectorAll('.confetti').forEach(c => c.remove());
            switchTab('challenge');
        }

        function setMode(mode) {
            if (state.dan === 1 && mode === 'HAS_REM') return;
            state.mode = mode;
            updateModeButtons();
        }

        function updateModeButtons() {
            const btnNoRem = document.getElementById('mode-no-rem');
            const btnHasRem = document.getElementById('mode-has-rem');
            const btnRandom = document.getElementById('mode-random');

            const common = "rounded-lg font-bold transition-all flex-[1] whitespace-nowrap overflow-hidden";
            const active = "mode-btn-active";
            const inactive = "mode-btn-inactive";
            const disabled = "mode-btn-disabled";

            btnNoRem.className = `py-2.5 ${common} text-[12px] tracking-tighter ` + (state.mode === 'NO_REM' ? active : inactive);
            btnRandom.className = `py-2.5 ${common} text-[13px] ` + (state.mode === 'RANDOM' ? active : inactive);

            if (state.dan === 1) {
                btnHasRem.className = `py-2.5 ${common} text-[12px] tracking-tighter ` + disabled;
                btnHasRem.disabled = true;
            } else {
                btnHasRem.className = `py-2.5 ${common} text-[12px] tracking-tighter ` + (state.mode === 'HAS_REM' ? active : inactive);
                btnHasRem.disabled = false;
            }
        }

        function setDan(dan) {
            state.dan = dan;
            if (dan === 1 && state.mode === 'HAS_REM') state.mode = 'NO_REM';
            renderMenu();
        }

        function renderMenu() {
            const container = document.getElementById('dan-buttons-area');
            container.innerHTML = "";
            STAGES.forEach(d => {
                const btn = document.createElement('button');
                btn.innerHTML = `<span class="font-bold text-lg">÷${d}</span>`;
                if (state.dan === d) {
                    btn.className = "h-14 rounded-xl text-lg dan-btn-active transition-all flex items-center justify-center";
                } else {
                    btn.className = "h-14 rounded-xl text-lg dan-btn-inactive hover:bg-cyan-50 transition-all flex items-center justify-center shadow-sm";
                }
                btn.onclick = () => setDan(d);
                container.appendChild(btn);
            });
            updateModeButtons();
            
            const is15Clear = [1,2,3,4,5].every(d => savedRecords[`stage-${d}-RANDOM`]);
            const is69Clear = [6,7,8,9].every(d => savedRecords[`stage-${d}-RANDOM`]);
            const isLastClear = savedRecords['range-15'] && savedRecords['range-69'];
            
            updateSpBtn('btn-sp-15', is15Clear, '÷1〜÷5');
            updateSpBtn('btn-sp-69', is69Clear, '÷6〜÷9');
            
            const lastBtn = document.getElementById('btn-sp-last');
            const rock = document.getElementById('rock-layer');
            if (isLastClear && !state.waitingForCrumble) {
                lastBtn.disabled = false;
                lastBtn.className = "w-full h-full rounded-xl font-black text-base shadow-md bg-gradient-to-r from-amber-400 to-orange-500 text-white btn-active relative z-30 flex items-center justify-center gap-2";
                lastBtn.innerHTML = `<i data-lucide="crown" class="w-5 h-5 fill-white"></i> ラストチャレンジ`;
                if(rock) rock.classList.add('hidden');
            } else {
                lastBtn.disabled = true;
                if(rock) rock.classList.remove('hidden');
            }

            const nigateArea = document.getElementById('nigate-area');
            if (savedNigate.length > 0) {
                nigateArea.classList.remove('hidden');
                document.getElementById('nigate-count').innerText = `あと ${savedNigate.length} 問`;
            } else {
                nigateArea.classList.add('hidden');
            }

            lucide.createIcons();
        }

        function updateSpBtn(id, unlocked, text) {
            const btn = document.getElementById(id);
            if (unlocked) {
                btn.disabled = false;
                btn.className = "py-2 rounded-xl font-bold text-sm shadow-md border-b-2 border-amber-300 bg-amber-50 text-amber-600 btn-active relative h-10 flex items-center justify-center";
                btn.innerHTML = `<span class="flex items-center gap-1"><i data-lucide="star" class="w-4 h-4 fill-amber-400 text-amber-400"></i> ${text}</span>`;
            } else {
                btn.disabled = true;
                btn.className = "py-2 rounded-xl font-bold text-sm shadow-sm border border-gray-200 bg-white text-gray-400 cursor-not-allowed relative h-10 flex items-center justify-center";
                btn.innerHTML = `<span class="flex items-center gap-1"><i data-lucide="lock" class="w-4 h-4"></i> ${text}</span>`;
            }
        }

        function startGame(type, val) {
            state.gameType = type;
            state.inputAns = "";
            state.inputRem = "";
            state.showHint = false; 
            state.combo = 0;
            updateCharacter('normal');
            
            let time = 30;
            let list = [];
            let key = "";
            
            if (type === 'stage') {
                const d = state.dan;
                list = generateDivisionProblems(d, state.mode, 10);
                key = `stage-${d}-${state.mode}`;
                time = 40; 
                state.isNoRemMode = (state.mode === 'NO_REM');
            } else if (type === 'range') {
                const range = val === '15' ? [1,2,3,4,5] : [6,7,8,9];
                list = generateRandomDivisionProblems(range, 20);
                time = 80; 
                key = `range-${val}`;
                state.isNoRemMode = false;
            } else if (type === 'last') {
                const range = [1,2,3,4,5,6,7,8,9];
                list = generateRandomDivisionProblems(range, 30);
                time = 120; 
                key = `last-challenge`;
                state.isNoRemMode = false;
            } else if (type === 'nigate') {
                list = shuffleArray([...savedNigate]).slice(0, 10);
                time = 40; 
                key = 'nigate-training';
                state.isNoRemMode = false; 
            }
            
            state.problems = list;
            state.index = 0;
            state.timer = time;
            state.maxTime = time;
            state.currentKey = key;
            
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('screen-game').classList.remove('hidden');
            updateDisplay();
            
            if (state.intervalId) clearInterval(state.intervalId);
            state.intervalId = setInterval(() => {
                state.timer--;
                const timerEl = document.getElementById('display-timer');
                const barEl = document.getElementById('time-bar');
                timerEl.innerText = state.timer;
                const pct = (state.timer / state.maxTime) * 100;
                barEl.style.width = pct + '%';
                if (state.timer <= 10) {
                    timerEl.classList.add('text-rose-600');
                    barEl.className = 'h-full rounded-full transition-all duration-1000 ease-linear bg-rose-500';
                } else {
                    timerEl.classList.remove('text-rose-600');
                    barEl.className = 'h-full rounded-full transition-all duration-1000 ease-linear bg-gradient-to-r from-cyan-400 to-blue-500';
                }
                if (state.timer <= 0) finishGame(false);
            }, 1000);
            lucide.createIcons();
        }

        function generateDivisionProblems(dan, mode, count) {
            let candidates = [];
            const noRemCands = [];
            for (let a = 1; a <= 9; a++) noRemCands.push({ q: `${dan * a} ÷ ${dan}`, a: a, rem: 0, dnd: dan*a, dsr: dan });
            const hasRemCands = [];
            if (dan > 1) {
                for (let a = 1; a <= 9; a++) {
                    for (let r = 1; r < dan; r++) hasRemCands.push({ q: `${dan * a + r} ÷ ${dan}`, a: a, rem: r, dnd: dan*a+r, dsr: dan });
                }
            }
            if (mode === 'NO_REM') candidates = noRemCands;
            else if (mode === 'HAS_REM') candidates = hasRemCands;
            else candidates = [...noRemCands, ...hasRemCands];
            return pickProblems(candidates, count);
        }

        function generateRandomDivisionProblems(range, count) {
            let candidates = [];
            range.forEach(d => {
                for (let a = 1; a <= 9; a++) {
                    candidates.push({ q: `${d * a} ÷ ${d}`, a: a, rem: 0, dnd: d*a, dsr: d });
                    if (d > 1) {
                        for (let r = 1; r < d; r++) candidates.push({ q: `${d * a + r} ÷ ${d}`, a: a, rem: r, dnd: d*a+r, dsr: d });
                    }
                }
            });
            return pickProblems(candidates, count);
        }

        function pickProblems(candidates, count) {
            if (candidates.length === 0) return [];
            let result = [];
            let lastQ = "";
            for(let i=0; i<count; i++) {
                let r;
                let attempts = 0;
                do {
                    r = candidates[Math.floor(Math.random() * candidates.length)];
                    attempts++;
                } while (r.q === lastQ && attempts < 10 && candidates.length > 1);
                result.push(r);
                lastQ = r.q;
            }
            return result;
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function toggleHint() {
            state.showHint = !state.showHint;
            updateDisplay();
        }

        function updateDisplay() {
            const p = state.problems[state.index];
            document.getElementById('q-dividend').innerText = p.dnd;
            document.getElementById('q-divisor').innerText = p.dsr;
            
            // ヒントの更新
            const hintRow = document.getElementById('hint-row');
            if (state.showHint) {
                hintRow.classList.remove('hidden');
                document.getElementById('h-divisor').innerText = p.dsr;
                document.getElementById('h-dividend').innerText = p.dnd;
                
                const quotBox = document.getElementById('h-quot-box');
                quotBox.innerText = state.inputAns !== "" ? state.inputAns : "▢";
                quotBox.style.color = state.inputAns !== "" ? "#0e7490" : "#fbbf24";

                const plusEl = document.getElementById('h-plus');
                const remCircEl = document.getElementById('h-rem-circ');
                if (p.rem > 0) {
                    plusEl.classList.remove('hidden');
                    remCircEl.classList.remove('hidden');
                } else {
                    plusEl.classList.add('hidden');
                    remCircEl.classList.add('hidden');
                }
            } else {
                hintRow.classList.add('hidden');
            }

            const aField = document.getElementById('a-field');
            const remOp = document.getElementById('rem-op');
            const remField = document.getElementById('rem-field');

            if (state.inputAns === "") {
                aField.innerText = "?";
                aField.classList.remove('text-cyan-700');
                aField.classList.add('text-cyan-200');
                aField.classList.add('border-cyan-300', 'bg-white/60'); 
                aField.classList.remove('border-cyan-100', 'bg-white/30'); 
            } else {
                aField.innerText = state.inputAns;
                aField.classList.remove('text-cyan-200');
                aField.classList.add('text-cyan-700');
                if (!state.isNoRemMode && state.inputAns !== "" && state.inputRem === "") {
                    aField.classList.remove('border-cyan-300', 'bg-white/60');
                    aField.classList.add('border-cyan-100', 'bg-white/30');
                } else {
                    aField.classList.add('border-cyan-300', 'bg-white/60');
                }
            }

            if (state.isNoRemMode) {
                remOp.classList.add('hidden');
                remField.classList.add('hidden');
            } else {
                if (state.inputAns !== "") {
                    remOp.classList.remove('hidden');
                    remField.classList.remove('hidden');
                    remField.innerText = state.inputRem;
                    if (state.inputRem === "") {
                        remField.classList.add('border-cyan-300', 'bg-white/60', 'animate-pulse');
                        remField.classList.remove('border-cyan-100', 'bg-white/30');
                    } else {
                        remField.classList.remove('animate-pulse');
                        remField.classList.add('border-cyan-300', 'bg-white/60');
                    }
                } else {
                    remOp.classList.add('hidden');
                    remField.classList.add('hidden');
                }
            }
            document.getElementById('display-count').innerText = `あと ${state.problems.length - state.index} 問`;
        }

        function updateCharacter(status) {
            const body = document.getElementById('char-body');
            const bubble = document.getElementById('char-bubble');
            const container = document.getElementById('char-container');
            
            // リセット
            body.className = "text-4xl filter drop-shadow-md transition-transform cursor-pointer select-none inline-block";
            void body.offsetWidth; // リフローを強制

            bubble.classList.remove('hidden');
            
            let charContent = "🐶"; 
            let msg = "";
            let anim = "";

            if (status === 'correct') {
                // 正解: 嬉しそうに
                charContent = "🐶🎵"; 
                msg = ["あたり！", "ナイス！", "いいね！"][Math.floor(Math.random()*3)];
                anim = "anim-bounce";
            } else if (status === 'super') {
                // スーパー: 王冠やキラキラ
                charContent = "🐶👑"; 
                msg = ["すごい！", "天才！", "止まらない！"][Math.floor(Math.random()*3)];
                anim = "anim-spin";
            } else if (status === 'wrong') {
                // 不正解: 汗をかく
                charContent = "🐶💦"; 
                msg = ["どんまい", "おしい！", "次いこう"][Math.floor(Math.random()*3)];
                anim = "anim-sway";
            } else {
                // 通常
                charContent = "🐶";
                msg = "がんばれ！";
            }

            body.innerText = charContent;
            bubble.innerText = msg;
            if(anim) body.classList.add(anim);

            // 一定時間後に戻す
            if (status !== 'normal') {
                setTimeout(() => {
                    if (state.combo > 0 && status !== 'wrong') {
                         body.innerText = "🐶🔥"; 
                         bubble.innerText = `${state.combo}れんぞく！`;
                         body.classList.remove(anim);
                    } else {
                        body.innerText = "🐶";
                        bubble.innerText = "がんばれ！";
                        body.classList.remove(anim);
                    }
                }, 1500);
            }
        }

        function pokeCharacter() {
            updateCharacter(state.combo >= 3 ? 'super' : 'correct');
            // playAudio('se-correct'); // 必要なら音を鳴らす
        }

        function inputNum(num) {
            if (state.inputAns === "") {
                state.inputAns = num.toString();
            } else if (!state.isNoRemMode && state.inputRem === "") {
                state.inputRem = num.toString();
            }
            updateDisplay();
        }

        function deleteNum() {
            if (!state.isNoRemMode && state.inputRem !== "") state.inputRem = state.inputRem.slice(0, -1);
            else state.inputAns = state.inputAns.slice(0, -1);
            updateDisplay();
        }

        function submitAnswer() {
            if (state.inputAns === "") return;
            const p = state.problems[state.index];
            const ans = parseInt(state.inputAns);
            const rem = state.inputRem === "" ? 0 : parseInt(state.inputRem);
            if (ans === p.a && rem === p.rem) {
                playAudio('se-correct');
                if (state.gameType === 'nigate') removeFromNigate(p);
                
                state.combo++;
                updateCharacter(state.combo >= 3 ? 'super' : 'correct');
                
                state.index++;
                state.inputAns = "";
                state.inputRem = "";
                state.showHint = false; 
                if (state.index >= state.problems.length) finishGame(true);
                else updateDisplay();
            } else {
                playAudio('se-wrong');
                if (state.gameType !== 'nigate') addToNigate(p);
                
                state.combo = 0;
                updateCharacter('wrong');
                
                finishGame(false);
            }
        }

        function addToNigate(prob) {
            const exists = savedNigate.some(p => p.q === prob.q);
            if (!exists) {
                savedNigate.push(prob);
                if (savedNigate.length > 100) savedNigate.shift();
                localStorage.setItem(STORAGE_KEY_NIGATE, JSON.stringify(savedNigate));
            }
        }
        
        function removeFromNigate(prob) {
            savedNigate = savedNigate.filter(p => p.q !== prob.q);
            localStorage.setItem(STORAGE_KEY_NIGATE, JSON.stringify(savedNigate));
        }

        function finishGame(isWin) {
            clearInterval(state.intervalId);
            const resScreen = document.getElementById('screen-result');
            const msg = document.getElementById('result-msg');
            const sub = document.getElementById('result-sub');
            const svgBox = document.getElementById('hanamaru-area');
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            resScreen.classList.remove('hidden');
            if (isWin) {
                if (state.gameType === 'nigate') {
                    msg.innerText = savedNigate.length === 0 ? "ニガテこくふく！" : "とっくんクリア！";
                    sub.innerText = savedNigate.length === 0 ? "ぜんぶクリアしたよ！すごい！" : `のこり ${savedNigate.length} もん！がんばれ！`;
                    svgBox.innerHTML = createHanamaruSVG(200, "努力賞");
                    launchFireworks();
                } else {
                    msg.innerText = "クリア！";
                    sub.innerText = "すごい！ぜんもんせいかい！";
                    const wasLocked = !(savedRecords['range-15'] && savedRecords['range-69']);
                    savedRecords[state.currentKey] = true;
                    localStorage.setItem(STORAGE_KEY_RECORDS, JSON.stringify(savedRecords));
                    const isNowUnlocked = savedRecords['range-15'] && savedRecords['range-69'];
                    if (wasLocked && isNowUnlocked) state.waitingForCrumble = true;
                    const lbl = (state.currentKey === 'last-challenge') ? "免許皆伝" : "ごうかく";
                    svgBox.innerHTML = createHanamaruSVG(200, lbl);
                    if (state.currentKey === 'last-challenge') {
                        playAudio('se-fanfare');
                        launchFireworks(); 
                    } else confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#22d3ee', '#38bdf8', '#fbbf24'] });
                }
            } else {
                msg.innerText = "おしまい";
                sub.innerText = "まちがえちゃった... もういちど！";
                svgBox.innerHTML = `<div class="bg-gray-100 p-8 rounded-full shadow-inner"><i data-lucide="x-circle" class="w-20 h-20 text-gray-300"></i></div>`;
                lucide.createIcons();
            }
        }

        function playAudio(id) {
            const a = document.getElementById(id);
            a.currentTime = 0;
            a.play().catch(()=>{});
        }

        function createHanamaruSVG(size, label) {
            return `
            <svg width="${size}" height="${size}" viewBox="0 0 200 200" class="drop-shadow-lg">
                <path class="path-hanamaru" d="M100,20 C110,5 140,5 150,25 C175,20 195,40 190,65 C210,75 210,105 190,115 C195,140 175,160 150,155 C140,180 110,180 100,160 C90,180 60,180 50,155 C25,160 5,140 10,115 C-10,105 -10,75 10,65 C5,40 25,20 50,25 C60,5 90,5 100,20" fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                <circle class="path-hanamaru" cx="100" cy="90" r="55" fill="none" stroke="#ef4444" stroke-width="5" />
                <text x="100" y="102" text-anchor="middle" fill="#ef4444" font-weight="900" font-size="28" style="font-family: 'M PLUS Rounded 1c'">${label}</text>
            </svg>`;
        }

        function renderRecords() {
            const badgeGrid = document.getElementById('special-badges-grid');
            badgeGrid.innerHTML = "";
            [['range-15', '÷1〜÷5'], ['range-69', '÷6〜÷9'], ['last-challenge', '全問制覇']].forEach(([k, n]) => {
                const ok = savedRecords[k];
                const d = document.createElement('div');
                d.className = `p-2 rounded-xl flex flex-col items-center justify-center gap-1 ${ok ? 'bg-amber-100 text-amber-600 border-2 border-amber-200 shadow-sm' : 'bg-gray-50 text-gray-300 border border-gray-200'}`;
                d.innerHTML = `<i data-lucide="trophy" class="w-5 h-5 ${ok?'fill-amber-400 text-amber-500':''}"></i><span class="text-[10px] font-bold leading-tight">${n}</span>`;
                badgeGrid.appendChild(d);
            });
            const tbody = document.getElementById('record-tbody');
            tbody.innerHTML = "";
            for(let d=1; d<=9; d++){
                const tr = document.createElement('tr');
                tr.className = "border-b border-cyan-50 hover:bg-cyan-50/50 transition-colors";
                let h = `<td class="text-left pl-4 font-bold text-cyan-900 py-2 text-sm">÷${d}</td>`;
                ['NO_REM', 'HAS_REM', 'RANDOM'].forEach(m => {
                    if (d===1 && m==='HAS_REM') h += `<td class="text-center py-2"><div class="w-5 h-5 mx-auto rounded-full bg-gray-200 text-gray-300 flex items-center justify-center text-[10px]">-</div></td>`;
                    else {
                        const ok = savedRecords[`stage-${d}-${m}`];
                        h += `<td class="text-center py-2"><div class="w-5 h-5 mx-auto rounded-full flex items-center justify-center ${ok ? 'bg-cyan-500 text-white shadow-sm' : 'bg-gray-100'}"><i data-lucide="check" class="w-3 h-3 ${ok?'':'hidden'}"></i></div></td>`;
                    }
                });
                tr.innerHTML = h;
                tbody.appendChild(tr);
            }
            if(savedRecords['last-challenge']) {
                document.getElementById('master-badge').classList.remove('hidden');
                document.getElementById('master-svg').innerHTML = createHanamaruSVG(120, "神");
            }
            lucide.createIcons();
        }

        function checkUnlockAndCrumble() {
            const rock = document.getElementById('rock-layer');
            if (!rock) return;
            const is15 = [1,2,3,4,5].every(d => savedRecords[`stage-${d}-RANDOM`]);
            const is69 = [6,7,8,9].every(d => savedRecords[`stage-${d}-RANDOM`]);
            const isUnlocked = is15 && is69;
            if (isUnlocked && !rock.classList.contains('hidden')) {
                rock.classList.add('animate-shake');
                playAudio('se-crumble'); 
                setTimeout(() => {
                    createRockFragments(rock);
                    rock.classList.add('hidden');
                    const btn = document.getElementById('btn-sp-last');
                    btn.disabled = false;
                    btn.className = "w-full h-full rounded-xl font-black text-base shadow-xl bg-gradient-to-r from-amber-400 to-orange-500 text-white btn-active relative z-30 animate-pulse flex items-center justify-center gap-2";
                    btn.innerHTML = `<i data-lucide="crown" class="w-5 h-5 fill-white"></i> ラストチャレンジ`;
                    lucide.createIcons();
                }, 800);
            }
        }

        function createRockFragments(rockElem) {
            const container = document.getElementById('last-challenge-box');
            for (let i = 0; i < 20; i++) {
                const fragment = document.createElement('div');
                fragment.style.position = 'absolute';
                fragment.style.background = '#64748b';
                fragment.style.zIndex = '50';
                const size = Math.random() * 20 + 10;
                fragment.style.width = size + 'px';
                fragment.style.height = size + 'px';
                fragment.style.left = '50%'; fragment.style.top = '50%';
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 150 + 50;
                const tx = Math.cos(angle) * dist + 'px';
                const ty = Math.sin(angle) * dist + 'px';
                fragment.animate([
                    { transform: 'translate(0,0) scale(1)', opacity: 1 },
                    { transform: `translate(${tx}, ${ty}) scale(0)`, opacity: 0 }
                ], { duration: 800, easing: 'ease-out' }).onfinish = () => fragment.remove();
                container.appendChild(fragment);
            }
        }

        function launchFireworks() {
            const container = document.getElementById('fireworks-container');
            container.innerHTML = '';
            const colors = ['#06b6d4', '#fbbf24', '#3b82f6', '#ec4899', '#10b981'];
            confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 }, colors: colors });
            for(let i=0; i<10; i++) {
                setTimeout(() => {
                    const cx = Math.random() * 80 + 10;
                    const cy = Math.random() * 50 + 10;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    for(let j=0; j<20; j++) {
                        const p = document.createElement('div');
                        p.className = 'firework-particle';
                        p.style.backgroundColor = color;
                        p.style.left = cx + '%'; p.style.top = cy + '%';
                        const angle = (j / 20) * 360;
                        const dist = Math.random() * 120 + 60;
                        const dx = Math.cos(angle * Math.PI / 180) * dist + 'px';
                        const dy = Math.sin(angle * Math.PI / 180) * dist + 'px';
                        p.style.setProperty('--dx', dx);
                        p.style.setProperty('--dy', dy);
                        p.style.animation = 'explode 1s ease-out forwards';
                        container.appendChild(p);
                        setTimeout(() => p.remove(), 1000);
                    }
                }, i * 300);
            }
        }
    </script>
</body>
</html>
